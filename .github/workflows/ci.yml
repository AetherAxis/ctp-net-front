name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 本仓 checkout 到仓名目录（跨仓 ProjectReference 解析到同级 <dep>/ 目录）
      - uses: actions/checkout@v4
        with:
          path: ctp-net-front
      # 跨仓依赖（本地 ProjectReference 拓扑——切 PackageReference 后可移除）
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/ctp-net-contracts
          path: ctp-net-contracts
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-exchange
          path: aether-exchange
      # 测试项目引用 ctp-net-core（E2E「SDK 即裁判」的官方 SDK wrapper）
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/ctp-net-core
          path: ctp-net-core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Packages 私有源凭据（GITHUB_TOKEN 只写进 CI 运行时文件，不入库）。
      # 依赖仓为私有仓时 GITHUB_TOKEN 默认不能跨仓读取——需在 org Settings → Actions →
      # General 开放 accessible repositories，或改用 PAT secret。
      - name: Configure GitHub Packages credentials
        run: >
          dotnet nuget update source github
          --configfile ctp-net-front/nuget.config
          --username AetherAxis
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Build
        run: dotnet build Ctp.Net.Front.slnx -c Release
        working-directory: ctp-net-front

      # 只跑纯 wire 格式钉子（OrderCodecShape/RtnOrderWidthShape——零 native P/Invoke）。
      # E2E（CtpTrader/CtpMarketData 走官方 C++ SDK）暂留本地/开发机：Core 的 build/native
      # 尚无 linux-x64 .so（MIGRATION.md §9.2 原生依赖统一交付的已知缺口）——补齐后在 CI 放开全量。
      - name: Test (wire-format pins)
        run: dotnet test Ctp.Net.Front.slnx -c Release --no-build
          --filter "FullyQualifiedName~OrderCodecShapeTests|FullyQualifiedName~RtnOrderWidthShapeTests"
        working-directory: ctp-net-front
